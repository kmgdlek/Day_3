<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 카페·맛집 노트</title>
  <meta name="description" content="제주 카페와 맛집 51곳을 카테고리·검색·관심도로 골라 보고, 가 보고 싶은 곳을 모아 보는 페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf6f0; --card: #fff; --ink: #2b2118; --muted: #8a7e72; --line: #eadfce;
      --accent: #b4532a; --cafe: #8a5a35; --food: #3f7a5c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', system-ui, sans-serif; line-height: 1.6; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

    /* 머리말 */
    header { padding: 56px 0 28px; }
    .eyebrow { font-size: 11px; letter-spacing: .3em; color: var(--accent); text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.02em; line-height: 1.25; }
    h1::after { content: ''; display: block; width: 36px; height: 2px; margin-top: 16px; background: var(--accent); }
    .lead { margin: 0; color: var(--muted); font-size: 15px; font-weight: 300; }
    .stats { display: flex; gap: 22px; margin-top: 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .stats b { color: var(--ink); font-weight: 500; font-size: 16px; margin-right: 4px; }

    /* 조작 바 */
    .bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 0; }
    .bar .wrap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #q { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 15px; padding: 10px 2px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--ink); outline: none; border-radius: 0; }
    #q::placeholder { color: #b9ab9b; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--ink); background: transparent; border: 1px solid var(--line); transition: all .15s; }
    .chip:hover { border-color: var(--accent); }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    #sort { font: inherit; font-size: 13px; padding: 7px 10px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    .count { font-size: 13px; color: var(--muted); margin: 18px 0 14px; }

    /* 카드 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 16px; padding-bottom: 60px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .2s, transform .2s; }
    .card:hover { box-shadow: 0 10px 28px rgba(60, 40, 20, .09); transform: translateY(-2px); }
    .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .tag { display: inline-block; font-size: 11px; letter-spacing: .08em; padding: 2px 9px; border-radius: 6px; color: #fff; }
    .tag.cafe { background: var(--cafe); } .tag.food { background: var(--food); }
    .name { margin: 8px 0 0; font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 18px; line-height: 1.35; }
    .heart { flex: none; font-size: 22px; line-height: 1; padding: 6px; background: none; border: 0; cursor: pointer; color: #cdbfae; transition: transform .15s, color .15s; }
    .heart:hover { transform: scale(1.15); }
    .heart[aria-pressed="true"] { color: var(--accent); }
    .desc { margin: 0; font-size: 14px; color: #5a4d41; font-weight: 300; flex: 1; }
    .score { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    .score input { flex: 1; accent-color: var(--accent); min-width: 0; }
    .score output { width: 26px; text-align: right; color: var(--ink); font-weight: 500; }
    .links { display: flex; gap: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
    .links a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .links a.src { color: var(--muted); font-weight: 400; margin-left: auto; }
    .links a:hover { text-decoration: underline; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--muted); }

    footer { border-top: 1px solid var(--line); padding: 22px 0 40px; font-size: 12px; color: var(--muted); line-height: 1.8; }

    @media (max-width: 560px) {
      header { padding: 36px 0 20px; }
      .wrap { padding: 0 16px; }
      .bar .wrap { gap: 8px; }
      #sort { margin-left: auto; }
      #q { font-size: 16px; }
    }

    /* AI 채팅 */
    #ai-open { position: fixed; right: 20px; bottom: 20px; z-index: 40; font: inherit; font-size: 15px; font-weight: 500; padding: 14px 20px; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: var(--ink); box-shadow: 0 8px 24px rgba(43, 33, 24, .3); transition: transform .15s, background .2s; }
    #ai-open:hover { background: var(--accent); transform: translateY(-2px); }
    #ai { position: fixed; right: 20px; bottom: 84px; z-index: 50; width: min(390px, calc(100vw - 24px)); height: min(580px, calc(100dvh - 110px)); display: none; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 50px rgba(43, 33, 24, .28); overflow: hidden; }
    #ai.show { display: flex; }
    .ai-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .ai-head b { font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 16px; }
    .ai-head small { display: block; color: var(--muted); font-size: 11px; font-weight: 300; }
    .ai-x { font: inherit; font-size: 22px; line-height: 1; padding: 4px 8px; background: none; border: 0; cursor: pointer; color: var(--muted); }
    #msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
    .m { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .m.u { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .m.a { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .m.a.err { color: #a33; }
    .m.a.wait { color: var(--muted); }
    .picks { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; max-width: 94%; }
    .pick { font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 999px; cursor: pointer; color: var(--accent); background: #fff; border: 1px solid var(--accent); }
    .pick:hover { background: var(--accent); color: #fff; }
    .sugg { display: flex; flex-wrap: wrap; gap: 6px; }
    .sugg button { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--ink); background: var(--card); border: 1px solid var(--line); }
    .sugg button:hover { border-color: var(--accent); }
    .ai-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--card); }
    #ai-q { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 10px 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; outline: none; }
    #ai-q:focus { border-color: var(--accent); }
    #ai-send { font: inherit; font-size: 14px; font-weight: 500; padding: 0 16px; border: 0; border-radius: 10px; cursor: pointer; color: #fff; background: var(--accent); }
    #ai-send:disabled { background: #c9b8a8; cursor: wait; }
    @media (max-width: 560px) {
      #ai-open { right: 14px; bottom: 14px; }
      #ai { right: 12px; left: 12px; width: auto; bottom: 76px; }
      #ai-q { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="eyebrow">Jeju · Cafe &amp; Table</div>
      <h1>제주 카페·맛집 노트</h1>
      <p class="lead">기사와 블로그에서 모은 제주 카페와 맛집이에요. 마음에 드는 곳엔 ♥ 를, 관심도엔 점수를 남겨 보세요.</p>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <div class="bar">
    <div class="wrap">
      <input id="q" type="search" placeholder="이름이나 설명으로 검색 (예: 흑돼지, 바다, 성산)" autocomplete="off" aria-label="검색">
      <div class="chips" id="chips" role="group" aria-label="분류">
        <button class="chip" type="button" data-cat="" aria-pressed="true">전체</button>
        <button class="chip" type="button" data-cat="카페" aria-pressed="false">카페</button>
        <button class="chip" type="button" data-cat="음식점" aria-pressed="false">음식점</button>
        <button class="chip" type="button" id="onlySel" aria-pressed="false">♥ 가 보고 싶은 곳</button>
      </div>
      <select id="sort" aria-label="정렬">
        <option value="file">기본순</option>
        <option value="score">관심도 높은 순</option>
        <option value="name">이름순</option>
      </select>
    </div>
  </div>

  <main class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="wrap">
      관심도 점수는 직접 정하는 값이며 실제 평점이 아닙니다. 설명은 아래 각 항목의 출처(기사·블로그)를 바탕으로 정리한 것이고, 영업 여부·시간·가격은 바뀔 수 있으니 방문 전 네이버 지도에서 확인하세요.
    </div>
  </footer>

  <button id="ai-open" type="button" aria-haspopup="dialog" aria-controls="ai">💬 AI에게 물어보기</button>
  <section id="ai" role="dialog" aria-label="AI 도우미">
    <div class="ai-head"><div><b>AI 도우미</b><small>이 페이지의 51곳 안에서만 추천해요</small></div><button class="ai-x" type="button" id="ai-close" aria-label="닫기">×</button></div>
    <div id="msgs" aria-live="polite"></div>
    <form class="ai-form" id="ai-form">
      <input id="ai-q" placeholder="예: 비 오는 날 갈 만한 곳 알려줘" autocomplete="off" maxlength="300" aria-label="AI에게 질문">
      <button id="ai-send" type="submit">보내기</button>
    </form>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const KEY = 'jeju-cafe-food-prefs';
    let items = [];
    const state = { q: '', cat: '', onlySel: false, sort: 'file' };

    // 내가 남긴 ♥ 와 점수는 이 브라우저에만 저장된다.
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { prefs = {}; }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch {} };
    const isSel = (it) => prefs[it.name]?.selected ?? it.selected;
    const scoreOf = (it) => prefs[it.name]?.score ?? it.score;
    const naver = (name) => 'https://map.naver.com/p/search/' + encodeURIComponent('제주 ' + name);

    function visible() {
      const q = state.q.trim().toLowerCase();
      let list = items.filter((it) =>
        (!state.cat || it.category === state.cat) &&
        (!state.onlySel || isSel(it)) &&
        (!q || (it.name + ' ' + it.description).toLowerCase().includes(q)));
      if (state.sort === 'score') list = [...list].sort((a, b) => scoreOf(b) - scoreOf(a));
      if (state.sort === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      return list;
    }

    function card(it) {
      const sel = isSel(it), sc = scoreOf(it);
      const cls = it.category === '카페' ? 'cafe' : 'food';
      return `<article class="card ${sel ? 'sel' : ''}" data-name="${esc(it.name)}">
        <div class="top">
          <div><span class="tag ${cls}">${esc(it.category)}</span><h2 class="name">${esc(it.name)}</h2></div>
          <button class="heart" type="button" aria-pressed="${sel}" aria-label="${esc(it.name)} 가 보고 싶은 곳에 ${sel ? '서 빼기' : '담기'}">${sel ? '♥' : '♡'}</button>
        </div>
        <p class="desc">${esc(it.description)}</p>
        <label class="score">관심도 <input type="range" min="0" max="100" step="5" value="${sc}" aria-label="${esc(it.name)} 관심도"><output>${sc}</output></label>
        <div class="links">
          <a href="${naver(it.name)}" target="_blank" rel="noopener noreferrer">네이버 지도 ↗</a>
          ${it.source ? `<a class="src" href="${esc(it.source)}" target="_blank" rel="noopener noreferrer">출처 ↗</a>` : ''}
        </div>
      </article>`;
    }

    function stats() {
      const n = (c) => items.filter((it) => it.category === c).length;
      $('stats').innerHTML = `<span><b>${items.length}</b>곳</span><span><b>${n('카페')}</b>카페</span><span><b>${n('음식점')}</b>음식점</span><span><b>${items.filter(isSel).length}</b>가 보고 싶은 곳</span>`;
    }

    function render() {
      const list = visible();
      $('count').textContent = `${items.length}곳 중 ${list.length}곳`;
      $('grid').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">조건에 맞는 곳이 없어요. 검색어나 분류를 바꿔 보세요.</div>';
      stats();
    }

    // ♥ 와 점수 (이벤트는 grid 한 곳에서 받는다)
    $('grid').addEventListener('click', (e) => {
      const btn = e.target.closest('.heart');
      if (!btn) return;
      const name = btn.closest('.card').dataset.name;
      const it = items.find((x) => x.name === name);
      prefs[name] = { ...prefs[name], selected: !isSel(it) };
      save(); render();
    });
    $('grid').addEventListener('input', (e) => {
      if (!e.target.matches('.score input')) return;
      const name = e.target.closest('.card').dataset.name;
      prefs[name] = { ...prefs[name], score: Number(e.target.value) };
      e.target.nextElementSibling.textContent = e.target.value;
      save();
    });
    $('grid').addEventListener('change', (e) => { if (e.target.matches('.score input') && state.sort === 'score') render(); });

    $('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
    $('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
    $('chips').addEventListener('click', (e) => {
      const b = e.target.closest('.chip');
      if (!b) return;
      if (b.id === 'onlySel') {
        state.onlySel = !state.onlySel;
        b.setAttribute('aria-pressed', String(state.onlySel));
      } else {
        state.cat = b.dataset.cat;
        document.querySelectorAll('.chip[data-cat]').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
      }
      render();
    });

    // ───────── AI 도우미 ─────────
    const history = [];   // 서버로 보내는 대화 기록 (이 페이지를 닫으면 사라짐)
    const SUGGEST = ['비 오는 날 갈 만한 곳은?', '바다가 보이는 카페 추천해줘', '성산 근처에서 점심 먹을 곳은?'];

    function addMsg(text, cls) {
      const d = document.createElement('div');
      d.className = 'm ' + cls; d.textContent = text;
      $('msgs').appendChild(d); $('msgs').scrollTop = $('msgs').scrollHeight;
      return d;
    }
    function showPicks(names) {
      if (!names.length) return;
      const box = document.createElement('div'); box.className = 'picks';
      names.forEach((n) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'pick'; b.textContent = n + ' ↓';
        b.addEventListener('click', () => {
          state.q = n; $('q').value = n; render();
          if (innerWidth <= 560) openAi(false);
          document.querySelector('.count').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        box.appendChild(b);
      });
      $('msgs').appendChild(box); $('msgs').scrollTop = $('msgs').scrollHeight;
    }
    function openAi(on) {
      $('ai').classList.toggle('show', on);
      $('ai-open').setAttribute('aria-expanded', String(on));
      if (on) {
        if (!$('msgs').children.length) {
          addMsg('안녕하세요! 이 페이지에 모은 제주 카페·맛집 51곳 안에서 골라 드려요. 무엇이 궁금하세요?', 'a');
          const s = document.createElement('div'); s.className = 'sugg';
          SUGGEST.forEach((t) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.addEventListener('click', () => { s.remove(); ask(t); }); s.appendChild(b); });
          $('msgs').appendChild(s);
        }
        setTimeout(() => $('ai-q').focus(), 50);
      }
    }
    async function ask(text) {
      text = text.trim();
      if (!text) return;
      $('ai-send').disabled = true;
      addMsg(text, 'u'); history.push({ role: 'user', content: text });
      const wait = addMsg('찾는 중…', 'a wait');
      try {
        const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) });
        const raw = await res.text();
        let data; try { data = JSON.parse(raw); } catch { throw new Error('서버 응답을 읽지 못했어요 (' + res.status + ')'); }
        if (data.error) throw new Error(data.error);
        wait.className = 'm a'; wait.textContent = data.answer;
        history.push({ role: 'assistant', content: data.answer });
        showPicks(data.places || []);
      } catch (e) {
        console.error(e);
        history.pop();   // 실패한 질문은 기록에서 뺀다
        wait.className = 'm a err'; wait.textContent = e.message || '답을 가져오지 못했어요. 잠시 후 다시 시도해 주세요.';
      } finally {
        $('ai-send').disabled = false; $('msgs').scrollTop = $('msgs').scrollHeight;
      }
    }
    $('ai-open').addEventListener('click', () => openAi(!$('ai').classList.contains('show')));
    $('ai-close').addEventListener('click', () => openAi(false));
    $('ai-form').addEventListener('submit', (e) => { e.preventDefault(); const v = $('ai-q').value; $('ai-q').value = ''; ask(v); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openAi(false); });

    fetch('jeju_restaurants.json')
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((data) => { items = data.items; render(); })
      .catch(() => {
        $('grid').innerHTML = '<div class="empty">데이터를 불러오지 못했어요.<br>파일을 더블클릭해서 열었다면, 배포된 주소나 로컬 서버(예: <code>python3 -m http.server</code>)로 열어 주세요.</div>';
      });
  </script>
</body>
</html>
